<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}
body {
    background: #080810;
    color: white;
}
header {
    background: #11111f;
    padding: 20px 8%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
}
.logo {
    color: #8b5cf6;
    font-size: 28px;
    font-weight: bold;
}
nav a {
    color: white;
    text-decoration: none;
    margin: 0 10px;
}
nav a:hover {
    color: #8b5cf6;
}
button {
    cursor: pointer;
}
.btn,
.cart-button {
    background: #7c3cff;
    color: white;
    border: 0;
    padding: 12px 20px;
    border-radius: 8px;
    font-weight: bold;
}
.cart-number {
    background: white;
    color: #7c3cff;
    padding: 3px 7px;
    border-radius: 50%;
    margin-left: 5px;
}
.hero {
    text-align: center;
    padding: 100px 20px;
    background: linear-gradient(135deg, #241044, #080810);
}
.hero h1 {
    font-size: 50px;
    margin-bottom: 15px;
}
.hero h1 span {
    color: #9b6aff;
}
.hero p {
    color: #bbb;
    margin-bottom: 25px;
}
.container {
    width: 85%;
    max-width: 1400px;
    margin: 60px auto;
}
.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}
#search {
    width: 250px;
    padding: 12px;
    background: #151522;
    color: white;
    border: 1px solid #33334d;
    border-radius: 8px;
}
.games {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 25px;
}
.game {
    background: #151515;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 10px 20px #0008;
}
.game-img {
    height: 220px;
    background-size: cover;
    background-position: center;
}
.game-info {
    padding: 15px;
}
.game-info h3 {
    font-size: 16px;
    margin-bottom: 7px;
}
.category {
    color: #999;
    font-size: 13px;
    margin-bottom: 8px;
}
.price {
    color: #9b6aff;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
}
.buy {
    width: 100%;
    padding: 9px;
    border: 0;
    border-radius: 6px;
    background: #292945;
    color: white;
}
.buy:hover {
    background: #7c3cff;
}
.ofertas-box {
    text-align: center;
    padding: 50px;
    background: linear-gradient(135deg, #211044, #11111f);
    border-radius: 15px;
}
.ofertas-box h2 {
    margin-bottom: 15px;
}
.ofertas-box p {
    color: #aaa;
    margin-bottom: 20px;
}
.cart-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #0009;
    z-index: 20;
}
.cart {
    position: fixed;
    top: 0;
    right: -400px;
    width: 400px;
    max-width: 100%;
    height: 100%;
    background: #111120;
    z-index: 30;
    padding: 20px;
    transition: .3s;
}
.cart.open {
    right: 0;
}
.cart-overlay.show {
    display: block;
}
.cart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 20px;
    border-bottom: 1px solid #292945;
}
.close-cart {
    background: none;
    border: 0;
    color: white;
    font-size: 30px;
}
.cart-items {
    padding: 20px 0;
    height: 70%;
    overflow-y: auto;
}
.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #19192d;
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 8px;
}
.remove-cart {
    background: #351b2a;
    color: #ff6688;
    border: 0;
    padding: 8px;
    border-radius: 5px;
}
.cart-total {
    display: flex;
    justify-content: space-between;
    font-size: 20px;
    margin-bottom: 15px;
}
.cart-total strong {
    color: #8b5cf6;
}
.checkout {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 40;
    background: #080810;
    overflow-y: auto;
    padding: 40px 20px;
}
.checkout.show {
    display: block;
}
.checkout-box {
    max-width: 700px;
    margin: auto;
    background: #15152b;
    padding: 30px;
    border-radius: 15px;
}
.close-checkout {
    float: right;
    background: none;
    border: 0;
    color: white;
    font-size: 30px;
}
.checkout p {
    color: #999;
    margin: 15px 0 25px;
}
.form {
    display: grid;
    gap: 12px;
}
.form input {
    width: 100%;
    padding: 12px;
    background: #19192d;
    border: 1px solid #353550;
    color: white;
    border-radius: 7px;
}
.checkout-section {
    background: #101021;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
}
.checkout-items div {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #292945;
}
footer {
    text-align: center;
    padding: 30px;
    background: #11111f;
    color: #888;
}
.no-results {
    text-align: center;
    color: #777;
    padding: 50px;
    grid-column: 1 / -1;
}
@media (max-width: 1100px) {
    .games {
        grid-template-columns: repeat(4, 1fr);
    }
}
@media (max-width: 800px) {
    .games {
        grid-template-columns: repeat(2, 1fr);
    }
    header {
        flex-direction: column;
        gap: 15px;
    }
    .section-title {
        flex-direction: column;
        gap: 15px;
    }
    #search {
        width: 100%;
    }
}
@media (max-width: 500px) {
    .games {
        grid-template-columns: 1fr;
    }
    .hero h1 {
        font-size: 35px;
    }
    .cart {
        width: 100%;
    }
}
</style>
</head>
<body>
<header>
    <button class="cart-button" onclick="abrirCarrinho()">
        🛒 Carrinho
        <span id="cartNumber" class="cart-number">0</span>
    </button>
</header>
<section class="hero">
    <h1>Seu próximo jogo está <span>aqui!</span></h1>
    <p>Encontre os melhores jogos para PC e consoles.</p>

    <button class="btn" onclick="irParaJogos()">
        Ver jogos
    </button>
</section>
<main class="container" id="jogos">
    <div class="section-title">
        <h2>🎮 Jogos em destaque</h2>
        <input
            id="search"
            type="text"
            placeholder="Pesquisar jogo...">
    </div>
    <div class="games" id="games"></div>
</main>
<!-- CARRINHO -->
<div id="cartOverlay" class="cart-overlay"></div>
<div id="carrinho" class="cart">
    <div class="cart-header">
        <h2>🛒 Carrinho</h2>
        <button class="close-cart" onclick="fecharCarrinho()">
            ×
        </button>
    </div>
    <div id="cartItems" class="cart-items"></div>
    <div class="cart-total">
        <span>Total:</span>
        <strong id="cartTotal">R$ 0,00</strong>
    </div>
    <button class="btn" style="width:100%" onclick="abrirCheckout()">
        Finalizar compra
    </button>
</div>
<div id="checkout" class="checkout">
    <div class="checkout-box">
        <button class="close-checkout" onclick="fecharCheckout()">
            ×
        </button>
        <h1>Finalizar compra</h1>
        <p>Checkout de demonstração.</p>
        <div class="checkout-section">
            <h2>👤 Dados</h2>
            <div class="form">
                <input id="nome" placeholder="Nome completo">
                <input id="email" type="email" placeholder="E-mail">
            </div>
        </div>
        <div class="checkout-section">
            <h2>📦 Produtos</h2>
            <div id="checkoutItems" class="checkout-items"></div>
            <br>
            <div class="cart-total">
                <span>Total:</span>
                <strong id="checkoutTotal">
                    R$ 0,00
                </strong>
            </div>
        </div>
        <button class="btn" style="width:100%" onclick="finalizarCompra()">
            Finalizar pedido
        </button>
    </div>
</div>
<footer id="contato">
2026 Games — Sua loja de jogos favorita
</footer>
<script>
const jogos = [
    {
        nome: "Cyberpunk 2077",
        categoria: "RPG • Ação",
        preco: 149.90,
        imagem: "https://cdn.akamai.steamstatic.com/steam/apps/1091500/header.jpg"
    },
    {
        nome: "Elden Ring",
        categoria: "RPG • Aventura",
        preco: 229.90,
        imagem: "https://cdn.akamai.steamstatic.com/steam/apps/1245620/header.jpg"
    },
    {
        nome: "Minecraft",
        categoria: "Sandbox • Aventura",
        preco: 99.90,
        imagem: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTwQRHbdKuDSiJ_smcbDg2Hy4QdDGfL0y2W3Q&s"
    },
    {
        nome: "God of War",
        categoria: "Ação • Aventura",
        preco: 199.90,
        imagem: "https://cdn.akamai.steamstatic.com/steam/apps/1593500/header.jpg"
    },
    {
        nome: "Counter-Strike 2",
        categoria: "FPS • Ação",
        preco: 0,
        imagem: "https://cdn.akamai.steamstatic.com/steam/apps/730/header.jpg"
    },
    {
        nome: "Mortal Kombat 11",
        categoria: "Luta • Ação",
        preco: 89.95,
        imagem: "https://cdn.akamai.steamstatic.com/steam/apps/976310/header.jpg"
    },
    {
        nome: "The Witcher 3",
        categoria: "RPG • Mundo Aberto",
        preco: 119.90,
        imagem: "https://cdn.akamai.steamstatic.com/steam/apps/292030/header.jpg"
    },
    {
        nome: "Hogwarts Legacy",
        categoria: "RPG • Aventura",
        preco: 199.90,
        imagem: "https://cdn.akamai.steamstatic.com/steam/apps/990080/header.jpg"
    },
    {
        nome: "Hades",
        categoria: "Roguelike • Ação",
        preco: 99.90,
        imagem: "https://cdn.akamai.steamstatic.com/steam/apps/1145360/header.jpg"
    },
    {
        nome: "Hollow Knight",
        categoria: "Aventura",
        preco: 46.99,
        imagem: "https://cdn.akamai.steamstatic.com/steam/apps/367520/header.jpg"
    }
];
let carrinho =
    JSON.parse(localStorage.getItem("carrinho")) || [];
function preco(valor) {
    return valor.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
    });
}
function salvar() {
    localStorage.setItem(
        "carrinho",
        JSON.stringify(carrinho)
    );
}
function renderizar(lista = jogos) {
    const area = document.getElementById("games");
    area.innerHTML = "";
    if (!lista.length) {
        area.innerHTML =
            '<div class="no-results">🎮 Nenhum jogo encontrado.</div>';
        return;
    }
    lista.forEach((jogo, index) => {
        area.innerHTML += `
            <div class="game">
                <div
                    class="game-img"
                    style="background-image:url('${jogo.imagem}')">
                </div>
                <div class="game-info">
                    <h3>${jogo.nome}</h3>
                    <p class="category">
                        ${jogo.categoria}
                    </p>
                    <p class="price">
                        ${jogo.preco === 0
                            ? "GRÁTIS"
                            : preco(jogo.preco)}
                    </p>
                    <button
                        class="buy"
                        onclick="comprar(${jogos.indexOf(jogo)})">
                        Comprar
                    </button>
                </div>
            </div>
        `;
    });
}
function comprar(index) {
    carrinho.push(jogos[index]);
    salvar();
    atualizarCarrinho();
    abrirCarrinho();
}
function atualizarCarrinho() {
    const area = document.getElementById("cartItems");
    document.getElementById("cartNumber").textContent =
        carrinho.length;
    area.innerHTML = "";
    let total = 0;
    carrinho.forEach((jogo, index) => {
        total += jogo.preco;
        area.innerHTML += `
            <div class="cart-item">
                <div>
                    <strong>${jogo.nome}</strong>
                    <br>
                    <span>
                        ${jogo.preco === 0
                            ? "GRÁTIS"
                            : preco(jogo.preco)}
                    </span>
                </div>
                <button
                    class="remove-cart"
                    onclick="remover(${index})">
                    🗑️
                </button>
            </div>
        `;
    });
    document.getElementById("cartTotal").textContent =
        preco(total);
    salvar();
}
function remover(index) {
    carrinho.splice(index, 1);
    atualizarCarrinho();
}
function abrirCarrinho() {
    document
        .getElementById("carrinho")
        .classList.add("open");
    document
        .getElementById("cartOverlay")
        .classList.add("show");
}
function fecharCarrinho() {
    document
        .getElementById("carrinho")
        .classList.remove("open");
    document
        .getElementById("cartOverlay")
        .classList.remove("show");
}
function abrirCheckout() {
    if (!carrinho.length) {
        alert("Seu carrinho está vazio!");
        return;
    }
    fecharCarrinho();
    const area =
        document.getElementById("checkoutItems");
    area.innerHTML = "";
    let total = 0;
    carrinho.forEach(jogo => {
        total += jogo.preco;
        area.innerHTML += `
            <div>
                <span>${jogo.nome}</span>
                <strong>
                    ${jogo.preco === 0
                        ? "GRÁTIS"
                        : preco(jogo.preco)}
                </strong>
            </div>
        `;
    });
    document.getElementById("checkoutTotal").textContent =
        preco(total);
    document
        .getElementById("checkout")
        .classList.add("show");
}
function fecharCheckout() {
    document
        .getElementById("checkout")
        .classList.remove("show");
}
function finalizarCompra() {
    const nome =
        document.getElementById("nome").value.trim();
    const email =
        document.getElementById("email").value.trim();
    if (!nome || !email) {
        alert("Preencha nome e e-mail.");
        return;
    }
    alert(
        "✅ Pedido realizado!\n\n" +
        "Cliente: " + nome + "\n" +
        "E-mail: " + email
    );
    carrinho = [];
    salvar();
    atualizarCarrinho();
    fecharCheckout();
    document.getElementById("nome").value = "";
    document.getElementById("email").value = "";
}
document
    .getElementById("search")
    .addEventListener("input", function () {
        const texto =
            this.value.toLowerCase();
        const resultados =
            jogos.filter(jogo =>
                jogo.nome.toLowerCase().includes(texto)
            );
        renderizar(resultados);
    });
function irParaJogos() {
    document
        .getElementById("jogos")
        .scrollIntoView({
            behavior: "smooth"
        });
}
document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
        fecharCarrinho();
        fecharCheckout();
    }
});
document
    .getElementById("cartOverlay")
    .addEventListener(
        "click",
        fecharCarrinho
    );
renderizar();
atualizarCarrinho();

</script>

</body>
</html>
